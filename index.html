<script>
// Класичний скрипт — виконується до модуля, тому ловить і його помилки теж.
(function () {
  function fail(detail) {
    var el = document.getElementById('boot');
    if (!el || el.classList.contains('failed')) return;
    el.classList.add('failed');
    el.textContent =
      'Не вдалося побудувати 3D-модель.\n\n' +
      (detail || 'Невідома помилка') +
      '\n\nСторінці потрібні WebGL та доступ до unpkg.com.';
  }
  window.addEventListener('error', function (e) {
    fail(String((e && e.message) || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    fail(String((r && r.message) || r || ''));
  });
})();
</script>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

// Єдиний рантайм-ассет сторінки. Ім'я файлу — без пробілів: на GitHub Pages
// шлях із пробілами доводиться кодувати, і будь-яке перейменування тихо ламає посилання.
const EMBLEM_SRC = './uploads/2026-08-30-21-44-36.jpg';

const M = {
  wall:   (() => {
    const cv = document.createElement('canvas');
    cv.width = 256; cv.height = 128;
    const c = cv.getContext('2d');
    c.fillStyle = '#6a6e75'; c.fillRect(0, 0, 256, 128);
    c.strokeStyle = 'rgba(0,0,0,0.10)'; c.lineWidth = 1.5;
    for (let row = 0; row < 8; row++) {
      const y = row * 16;
      c.beginPath(); c.moveTo(0, y); c.lineTo(256, y); c.stroke();
      const off = row % 2 ? 32 : 0;
      for (let bx = off; bx < 256; bx += 64) {
        c.beginPath(); c.moveTo(bx, y); c.lineTo(bx, y + 16); c.stroke();
      }
    }
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
    const mm = new THREE.MeshStandardMaterial({ name: 'wall_brick', map: t, roughness: 0.9 });
    mm.userData.uvPerMeter = [0.5, 1.5];
    return mm;
  })(),
  plinth: (() => {
    const cv = document.createElement('canvas');
    cv.width = 256; cv.height = 128;
    const c = cv.getContext('2d');
    c.fillStyle = '#8b4137'; c.fillRect(0, 0, 256, 128);
    c.strokeStyle = 'rgba(0,0,0,0.16)'; c.lineWidth = 2;
    for (let row = 0; row < 8; row++) {
      const y = row * 16;
      c.beginPath(); c.moveTo(0, y); c.lineTo(256, y); c.stroke();
      const off = row % 2 ? 32 : 0;
      for (let bx = off; bx < 256; bx += 64) { c.beginPath(); c.moveTo(bx, y); c.lineTo(bx, y + 16); c.stroke(); }
    }
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
    const mm = new THREE.MeshStandardMaterial({ name: 'plinth_brick', map: t, roughness: 0.85 });
    mm.userData.uvPerMeter = [0.5, 1.5];
    return mm;
  })(),
  terrace: (() => {
    const cv = document.createElement('canvas');
    cv.width = 256; cv.height = 128;
    const c = cv.getContext('2d');
    c.fillStyle = '#6a6e75'; c.fillRect(0, 0, 256, 128);
    c.strokeStyle = 'rgba(0,0,0,0.14)'; c.lineWidth = 2;
    for (let row = 0; row < 8; row++) {
      const y = row * 16;
      c.beginPath(); c.moveTo(0, y); c.lineTo(256, y); c.stroke();
      const off = row % 2 ? 32 : 0;
      for (let bx = off; bx < 256; bx += 64) { c.beginPath(); c.moveTo(bx, y); c.lineTo(bx, y + 16); c.stroke(); }
    }
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
    const mm = new THREE.MeshStandardMaterial({ name: 'terrace_brick', map: t, roughness: 0.85 });
    mm.userData.uvPerMeter = [0.5, 1.5];
    return mm;
  })(),
  frame:  new THREE.MeshStandardMaterial({ polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, name: 'frame_white', color: 0xf2efe9, roughness: 0.5 }),
  glass:  new THREE.MeshStandardMaterial({ polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, name: 'glazing', color: 0x9fb6bb, roughness: 0.12, metalness: 0.3 }),
  door:   new THREE.MeshStandardMaterial({ name: 'door_paint', color: 0x7a3327, roughness: 0.6 }),
  roof:   new THREE.MeshStandardMaterial({ name: 'roof_dark', color: 0x6f6b66, roughness: 0.95 }),
  pvc:    new THREE.MeshStandardMaterial({ name: 'door_pvc_white', color: 0xeeece6, roughness: 0.45 }),
  slate:  new THREE.MeshStandardMaterial({ name: 'slate_corrugated', color: 0x4a3122, roughness: 0.9 }),
  brown:  new THREE.MeshStandardMaterial({ name: 'canopy_side_brown', color: 0x4a3122, roughness: 0.8 }),
  metal:  new THREE.MeshStandardMaterial({ name: 'metal_tube', color: 0xb6b9ba, roughness: 0.35, metalness: 0.35 }),
  discFace: new THREE.MeshStandardMaterial({ name: 'emblem_base_white', color: 0xf6f4f0, roughness: 0.45 }),
  discEdge: new THREE.MeshStandardMaterial({ name: 'emblem_base_green', color: 0x6cb033, roughness: 0.5 }),
  black:  new THREE.MeshStandardMaterial({ name: 'parapet_black', color: 0x2b2926, roughness: 0.8 }),
  tile:   new THREE.MeshStandardMaterial({ name: 'step_tile', color: 0x6d5b52, roughness: 0.55 }),
};

const g = new THREE.Group();
g.name = 'lyceum_facade';

// box by min corner + size (meters). x: along facade, y: up, z: depth (front face at z=0)
function box(name, mat, x, y, z, w, h, d, parent = g) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.name = name;
  m.position.set(x + w / 2, y + h / 2, z + d / 2);
  if (mat && mat.userData && mat.userData.uvPerMeter) {
    const [ux, uy] = mat.userData.uvPerMeter;
    const uv = m.geometry.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w * ux, uv.getY(i) * h * uy);
    uv.needsUpdate = true;
  }
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

function tube(name, mat, x, y0, z, radius, height, parent = g) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 24), mat);
  m.name = name; m.position.set(x, y0 + height / 2, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function railBar(name, mat, x, z1, y1, z2, y2, radius) {
  const a = new THREE.Vector3(x, y1, z1), b = new THREE.Vector3(x, y2, z2);
  const len = a.distanceTo(b);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 20), mat);
  m.name = name;
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  m.castShadow = true;
  g.add(m);
  return m;
}

const L = 66.1;                 // повна довжина фасаду, осі 1–4
const AX3 = 39.0;               // вісь 3
const D1 = 14.0, D2 = 20.0;     // глибина корпусів (прийнято, планів немає)
const GND = -1.58, PL = -0.38, TOP = 7.42;
const SK = 0.30;                // товщина передньої "шкіри" стіни (глибина відкосу)
function facadeSkin(prefix, xa, xb, ya, yb, openings) {
  const ys = new Set([ya, yb]);
  openings.forEach(o => { ys.add(Math.max(ya, o.y0)); ys.add(Math.min(yb, o.y1)); });
  const yl = [...ys].sort((p, q) => p - q);
  let k = 0;
  for (let i = 0; i < yl.length - 1; i++) {
    const y0 = yl[i], y1 = yl[i + 1], mid = (y0 + y1) / 2;
    const act = openings.filter(o => o.y0 < mid && o.y1 > mid).sort((p, q) => p.x0 - q.x0);
    let cur = xa;
    for (const o of act) {
      if (o.x0 > cur) box(prefix + '_' + (++k), M.wall, cur, y0, -SK, o.x0 - cur, y1 - y0, SK);
      cur = Math.max(cur, o.x1);
    }
    if (cur < xb) box(prefix + '_' + (++k), M.wall, cur, y0, -SK, xb - cur, y1 - y0, SK);
  }
}

// дві ніші вхідних дверей, западають на 30 см
const RY1 = 2.85, RD = 0.3;
const NICHES = [[26.95, 29.70], [30.15, 33.05]];
const PIERS = [[-0.5, 26.95], [29.70, 30.15], [33.05, AX3]];

// цоколь
PIERS.forEach(([a, b], i) => box('plinth_main_' + (i + 1), M.plinth, a, GND, -D1 - 0.08, b - a, PL - GND, D1 + 0.16));
NICHES.forEach(([a, b], i) => box('plinth_niche_back_' + (i + 1), M.plinth, a, GND, -D1 - 0.08, b - a, PL - GND, D1 + 0.08 - RD));
box('plinth_hall', M.plinth, AX3, GND, -D2 - 0.08, L - AX3, PL - GND, D2 + 0.16);
// виступ (поясок) по верхній межі цоколя
box('plinth_cornice_classrooms', M.plinth, -0.6, PL - 0.1, 0.02, 26.35, 0.1, 0.18);
box('plinth_cornice_halls', M.plinth, AX3, PL - 0.1, 0.02, L - AX3 + 0.1, 0.1, 0.18);
// стіни (об'єми корпусів)
PIERS.forEach(([a, b], i) => box('block_classrooms_' + (i + 1), M.wall, a, PL, -D1, b - a, TOP - PL, D1 - SK));
const NICHE_WIN = [28.25, 31.25];
NICHES.forEach(([a, b], i) => {
  const wx0 = NICHE_WIN[i] - 0.9, wx1 = NICHE_WIN[i] + 0.9, wy0 = 3.72, wy1 = 5.72;
  box('wall_over_niche_' + (i + 1) + '_below', M.wall, a, RY1, -D1, b - a, wy0 - RY1, D1);
  box('wall_over_niche_' + (i + 1) + '_above', M.wall, a, wy1, -D1, b - a, TOP - wy1, D1);
  box('wall_over_niche_' + (i + 1) + '_l', M.wall, a, wy0, -D1, wx0 - a, wy1 - wy0, D1);
  box('wall_over_niche_' + (i + 1) + '_r', M.wall, wx1, wy0, -D1, b - wx1, wy1 - wy0, D1);
  box('wall_over_niche_' + (i + 1) + '_back', M.wall, wx0, wy0, -D1, wx1 - wx0, wy1 - wy0, D1 - SK);
  box('niche_back_wall_' + (i + 1), M.wall, a, PL, -D1, b - a, RY1 - PL, D1 - RD);
});
box('block_halls', M.wall, AX3, PL, -D2, L - AX3, TOP - PL, D2 - SK);
// парапет і покриття
const PAR = 0.55, PTOP = TOP + PAR;
box('parapet_cls_front', M.black, -0.6, TOP, -0.12, AX3 + 0.6, PAR, 0.32);
box('parapet_cls_left', M.black, -0.6, TOP, -D1 - 0.1, 0.32, PAR, D1 + 0.2);
box('parapet_cls_back', M.black, -0.6, TOP, -D1 - 0.1, AX3 + 0.6, PAR, 0.32);
box('parapet_hall_front', M.black, AX3, TOP, -0.12, L - AX3 + 0.1, PAR, 0.32);
box('parapet_hall_right', M.black, L - 0.22, TOP, -D2 - 0.1, 0.32, PAR, D2 + 0.2);
box('parapet_hall_back', M.black, AX3, TOP, -D2 - 0.1, L - AX3 + 0.1, PAR, 0.32);
box('roof_classrooms', M.roof, -0.3, TOP - 0.02, -D1 + 0.2, AX3 + 0.1, 0.06, D1 - 0.4);
box('roof_halls', M.roof, AX3 + 0.2, TOP - 0.02, -D2 + 0.2, L - AX3 - 0.4, 0.06, D2 - 0.4);

// вікно з відкосом: скло заглиблене, рама по контуру
function window2(name, cx, y0, w, h, transom = true) {
  const x0 = cx - w / 2, fr = 0.09, z = -SK;
  box(name + '_glass', M.glass, x0 + fr, y0 + fr, z - 0.03, w - 2 * fr, h - 2 * fr, 0.05);
  box(name + '_frame_l', M.frame, x0, y0, z, fr, h, 0.12);
  box(name + '_frame_r', M.frame, x0 + w - fr, y0, z, fr, h, 0.12);
  box(name + '_frame_b', M.frame, x0, y0, z, w, fr, 0.12);
  box(name + '_frame_t', M.frame, x0, y0 + h - fr, z, w, fr, 0.12);
  if (transom) {
    box(name + '_transom', M.frame, x0, y0 + h - 0.55, z, w, 0.07, 0.12);
    box(name + '_mullion', M.frame, cx - 0.035, y0, z, 0.07, h - 0.55, 0.12);
  }
  box(name + '_sill', M.frame, x0 - 0.12, y0 - 0.09, -SK, w + 0.24, 0.09, SK + 0.2);
}

function windowWide(name, cx, y0, w, h, panes) {
  const x0 = cx - w / 2, fr = 0.1, z = 0.01;
  box(name + '_glass', M.glass, x0 + fr, y0 + fr, z, w - 2 * fr, h - 2 * fr, 0.05);
  box(name + '_frame_l', M.frame, x0, y0, z, fr, h, 0.11);
  box(name + '_frame_r', M.frame, x0 + w - fr, y0, z, fr, h, 0.11);
  box(name + '_frame_b', M.frame, x0, y0, z, w, fr, 0.11);
  box(name + '_frame_t', M.frame, x0, y0 + h - fr, z, w, fr, 0.11);
  box(name + '_transom', M.frame, x0, y0 + h - 0.55, z, w, 0.08, 0.1);
  for (let c = 1; c < panes; c++) box(name + '_mullion_' + c, M.frame, x0 + (w * c) / panes - 0.04, y0, z, 0.08, h, 0.1);
  box(name + '_sill', M.frame, x0 - 0.08, y0 - 0.1, 0, w + 0.16, 0.1, 0.2);
}

// другий поверх — вікна осей 1–3; над входом одне широке
for (let i = 0; i < 12; i++) window2('win_2f_' + (i + 1), 4.25 + 3 * i, 3.72, 1.8, 2.0);
// перший поверх — 8 вікон, осі 1–2
for (let i = 0; i < 8; i++) window2('win_1f_' + (i + 1), 4.25 + 3 * i, i === 0 ? 0.84 : 0.34, 1.8, i === 0 ? 1.5 : 2.0);
// вікна праворуч від входу
window2('win_1f_9', 34.25, 1.1, 1.8, 1.55);
window2('win_1f_10', 37.25, 1.1, 1.8, 1.55);
// шкіра фасаду з реальними отворами
facadeSkin('skin_cls', -0.5, AX3, PL, TOP, [
  ...Array.from({ length: 12 }, (_, i) => ({ x0: 4.25 + 3 * i - 0.9, x1: 4.25 + 3 * i + 0.9, y0: 3.72, y1: 5.72 })),
  ...Array.from({ length: 8 }, (_, i) => ({ x0: 4.25 + 3 * i - 0.9, x1: 4.25 + 3 * i + 0.9, y0: i === 0 ? 0.84 : 0.34, y1: 2.34 })),
  { x0: 33.35, x1: 35.15, y0: 1.1, y1: 2.65 },
  { x0: 36.35, x1: 38.15, y0: 1.1, y1: 2.65 },
  ...NICHES.map(([a, b]) => ({ x0: a, x1: b, y0: PL, y1: RY1 })),
]);
facadeSkin('skin_hall', AX3, L, PL, TOP,
  [39.6, 45.6, 51.6, 57.6].map(x => ({ x0: x, x1: x + 4.6, y0: 0.3, y1: 5.72 })));

// вітражі блоку залів — 4 шт.
function curtainWall(name, x0, w) {
  const y0 = 0.30, h = 5.42, fr = 0.11, z = -SK;
  box(name + '_glass', M.glass, x0 + fr, y0 + fr, z, w - 2 * fr, h - 2 * fr, 0.06);
  box(name + '_frame_l', M.frame, x0, y0, z, fr, h, 0.14);
  box(name + '_frame_r', M.frame, x0 + w - fr, y0, z, fr, h, 0.14);
  box(name + '_frame_b', M.frame, x0, y0, z, w, fr, 0.14);
  box(name + '_frame_t', M.frame, x0, y0 + h - fr, z, w, fr, 0.14);
  box(name + '_sill', M.frame, x0 - 0.13, y0 - 0.09, -SK, w + 0.26, 0.09, SK + 0.2);
  for (let c = 1; c <= 2; c++) box(name + '_mullion_' + c, M.frame, x0 + (w * c) / 3 - 0.045, y0, z, 0.09, h, 0.11);
  for (let r = 1; r <= 3; r++) box(name + '_transom_' + r, M.frame, x0, y0 + 0.55 + ((h - 0.55) * (r - 1)) / 3, z, w, 0.09, 0.11);
}
[39.6, 45.6, 51.6, 57.6].forEach((x, i) => curtainWall('curtain_' + (i + 1), x, 4.6));

// вхідна група: двері, козирок, ганок, огорожа тераси
function entranceDoor(name, cx, zOff = 0) {
  const w = 2.3, B = -0.5, H = 3.15, dh = 2.25, x0 = cx - w / 2, z = 0.01 + zOff, fr = 0.09;
  const h = dh;
  // металопластикові полотна: біла рама, велике скління, глухий низ
  for (const [side, lx] of [['l', x0], ['r', x0 + w / 2 + 0.02]]) {
    const lw = w / 2 - 0.02;
    box(name + '_leaf_' + side, M.pvc, lx, B, z, lw, h, 0.07);
    box(name + '_glass_' + side, M.glass, lx + fr, B + 0.85, z + 0.05, lw - 2 * fr, h - 0.85 - fr, 0.04);
    box(name + '_rail_' + side, M.pvc, lx, B + 0.78, z + 0.06, lw, 0.09, 0.05);
    box(name + '_handle_' + side, M.metal, side === 'l' ? lx + lw - 0.16 : lx + 0.08, B + 1.0, z + 0.09, 0.08, 0.32, 0.05);
  }
  // фрамуга над дверима: скло у тій самій рамі

{
  const stripeMats = {
    blue: new THREE.MeshStandardMaterial({ name: 'stripe_blue', color: 0x0057b7, roughness: 0.6 }),
    yellow: new THREE.MeshStandardMaterial({ name: 'stripe_yellow', color: 0xffd700, roughness: 0.6 }),
    green: new THREE.MeshStandardMaterial({ name: 'stripe_green', color: 0x1a7a3c, roughness: 0.6 }),
    red: new THREE.MeshStandardMaterial({ name: 'stripe_red', color: 0xc8102e, roughness: 0.6 }),
  };
  const Z_PAINT = 0.012, T = 0.26;
  Object.values(stripeMats).forEach(mm => {
    mm.polygonOffset = true; mm.polygonOffsetFactor = -4; mm.polygonOffsetUnits = -4;
    mm.side = THREE.DoubleSide;
  });

  // суцільна лента: одна геометрія вздовж кривої, спільні торці — без зубців
  function ribbon(nm, mat, pts, offset, T) {
    const n = pts.length;
    const verts = [], idx = [], uvs = [];
    for (let i = 0; i < n; i++) {
      const p = pts[i];
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      const tx = b[0] - a[0], ty = b[1] - a[1];
      const len = Math.hypot(tx, ty) || 1;
      const nx = -ty / len, ny = tx / len;
      const cx = p[0] + nx * offset, cy = p[1] + ny * offset;
      verts.push(cx - nx * T / 2, cy - ny * T / 2, Z_PAINT);
      verts.push(cx + nx * T / 2, cy + ny * T / 2, Z_PAINT);
      uvs.push(0, 0, 1, 1);
      if (i < n - 1) { const k = i * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, mat);
    m.name = nm;
    g.add(m);
    return m;
  }

  // плавна хвиля у глухому поясі: нічого не перекриває, без зламів
  function band(nm, yMid, amp, period, phase, mats, xa, xb) {
    const pts = [];
    for (let x = xa; x <= xb; x += 0.08) {
      pts.push([x, yMid + amp * Math.sin((2 * Math.PI * x) / period + phase)]);
    }
    mats.forEach((mat, k) => ribbon(nm + '_' + (k + 1), mat, pts, -(k - 0.5) * T, T));
  }

  // синьо-жовта — пояс між поверхами

    }

    const t = (x + fw / 2) / fw;                     // 0 біля древка, 1 на вільному краї
    const wave = Math.sin(t * Math.PI * 2.4 - 0.6) * 0.14 * t
      + Math.sin(t * Math.PI * 5.1 + 1.2) * 0.05 * t;
    const sag = -0.09 * t * t;                       // провис під власною вагою
    const twist = wave * (y / fh) * 0.5;
    pos.setZ(i, wave + twist);
    pos.setY(i, y * (1 - 0.06 * t) + sag);
  }
  geo.computeVertexNormals();
  const flagMat = mat.clone();
  flagMat.name = mat.name;
  flagMat.side = THREE.DoubleSide;
  flagMat.roughness = 0.85;
  const flag = new THREE.Mesh(geo, flagMat);
  flag.name = nm + '_flag';
  flag.rotation.y = Math.PI / 2;
  flag.rotation.z = -0.04;
  flag.position.set(px + 0.06, 7.42 - 0.28 - fh / 2, 1.6 + fw / 2);
  flag.castShadow = true;
  g.add(flag);

  // кріплення до древка
  for (const cy of [0.4, -0.4]) {
    tube(nm + '_clip_' + (cy > 0 ? 'top' : 'bot'), M.metal, px, 7.42 - 0.28 - fh / 2 + cy * fh - 0.02, 1.6, 0.018, 0.05);
  }
}

// оточення (небо, двір) — окремою групою, не входить в експорт і в кадрування
const env = new THREE.Group();
env.name = 'environment';
// небо
{
  const cv = document.createElement('canvas');
  cv.width = 8; cv.height = 256;
  const c = cv.getContext('2d');
  const gr = c.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#6f9dc8'); gr.addColorStop(0.55, '#b9d2e6'); gr.addColorStop(1, '#e8eff2');
  c.fillStyle = gr; c.fillRect(0, 0, 8, 256);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sky = new THREE.Mesh(new THREE.SphereGeometry(240, 32, 20), new THREE.MeshBasicMaterial({ name: 'sky', map: tex, side: THREE.BackSide }));
  sky.name = 'sky_dome';
  sky.position.set(33, 0, 10);
  env.add(sky);
}
// придворова територія
{
  const gv = document.createElement('canvas');
  gv.width = 128; gv.height = 128;
  const gc = gv.getContext('2d');
  gc.fillStyle = '#7d9159'; gc.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 2600; i++) {
    const gx = Math.random() * 128, gy = Math.random() * 128;
    gc.strokeStyle = ['#6b8149', '#8fa567', '#5d7440', '#9bb072'][i % 4];
    gc.lineWidth = 1;
    gc.beginPath(); gc.moveTo(gx, gy); gc.lineTo(gx + (Math.random() - 0.5) * 2, gy - 2 - Math.random() * 3); gc.stroke();
  }
  const gtex = new THREE.CanvasTexture(gv);
  gtex.colorSpace = THREE.SRGBColorSpace;
  gtex.wrapS = gtex.wrapT = THREE.RepeatWrapping;
  gtex.repeat.set(120, 90);
  gtex.anisotropy = 8;
  const groundMat = new THREE.MeshStandardMaterial({ name: 'yard_grass', map: gtex, roughness: 0.95 });
  box('yard_grass', groundMat, -80, GND - 0.06, -60, 240, 0.06, 170, env);
  const asphaltMat = new THREE.MeshStandardMaterial({ name: 'yard_asphalt', color: 0x63615d, roughness: 0.95 });
  const kerbMat = new THREE.MeshStandardMaterial({ name: 'yard_kerb_white', color: 0xe9e6de, roughness: 0.8 });

  // бетонні плити перед входом: від лівого краю вікна ліворуч тераси до середини правого вітража
  const PX0 = 24.35, PX1 = 41.9, PZ0 = 3.3, PDEPTH = 14;
  const pv = document.createElement('canvas');
  pv.width = 256; pv.height = 256;
  const pc = pv.getContext('2d');
  pc.fillStyle = '#b9b7ae'; pc.fillRect(0, 0, 256, 256);
  pc.strokeStyle = '#9d9a91'; pc.lineWidth = 4;
  pc.strokeRect(2, 2, 252, 252);
  const ptex = new THREE.CanvasTexture(pv);
  ptex.colorSpace = THREE.SRGBColorSpace;
  ptex.wrapS = ptex.wrapT = THREE.RepeatWrapping;
  ptex.repeat.set((PX1 - PX0) / 0.75, PDEPTH / 0.75);
  ptex.anisotropy = 8;
  const paveMat = new THREE.MeshStandardMaterial({ name: 'yard_paving', map: ptex, roughness: 0.9 });
  const plaza = new THREE.Mesh(new THREE.PlaneGeometry(PX1 - PX0, PDEPTH), paveMat);
  plaza.name = 'yard_plaza';
  plaza.rotation.x = -Math.PI / 2;
  plaza.position.set((PX0 + PX1) / 2, GND + 0.01, PZ0 + PDEPTH / 2);
  plaza.receiveShadow = true;
  env.add(plaza);

  // асфальт 1,5 м вздовж фасаду ліворуч і праворуч, далі клумба, далі дорога 3 м
  const WW = (PZ0 - 0.4) / 2;
  box('walk_asphalt_center', asphaltMat, PX0, GND, 0, PX1 - PX0, 0.05, PZ0 - 0.4, env);
  box('walk_asphalt_terrace_l', asphaltMat, PX0, GND, 0, 25.75 - PX0, 0.05, PZ0, env);
  box('walk_asphalt_terrace_r', asphaltMat, 39.0, GND, 0, PX1 - 39.0, 0.05, PZ0, env);
  box('walk_asphalt_l', asphaltMat, -0.5, GND, 0, PX0 + 0.5, 0.05, WW, env);
  box('walk_asphalt_r', asphaltMat, PX1, GND, 0, L + 0.5 - PX1, 0.05, WW, env);
  const RZ = PZ0 + 0.1 + 2.0;
  box('road_asphalt_l', asphaltMat, -0.5, GND, RZ, PX0 + 0.5, 0.05, 3.0, env);
  box('road_asphalt_r', asphaltMat, PX1, GND, RZ, L - PX1, 0.05, 3.0, env);
  box('road_kerb_l_near', kerbMat, -0.5, GND, RZ - 0.15, PX0 + 0.5, 0.14, 0.15, env);
  box('road_kerb_l_far', kerbMat, -0.5, GND, RZ + 3.0, PX0 + 0.5, 0.14, 0.15, env);
  box('road_kerb_r_near', kerbMat, PX1, GND, RZ - 0.15, L - PX1, 0.14, 0.15, env);
  box('road_kerb_r_far', kerbMat, PX1, GND, RZ + 3.0, L - PX1, 0.14, 0.15, env);

  // кущі на клумбі
  {
    const bushMat = new THREE.MeshStandardMaterial({ name: 'bush_green', color: 0x4f6b3a, roughness: 0.9 });
    let bn = 0;
    for (let x = 1.5; x < L; x += 2.6) {
      if (x > PX0 - 1 && x < PX1 + 1) continue;
      const bz = PZ0 - 0.2 + 0.9;
      const rr = 0.42 + ((x * 7) % 5) * 0.03;
      const b = new THREE.Mesh(new THREE.SphereGeometry(rr, 14, 10), bushMat);
      b.name = 'bush_' + (++bn);
      b.scale.y = 0.8;
      b.position.set(x, GND + rr * 0.6, bz);
      b.castShadow = true;
      env.add(b);
    }
  }

  // залізний паркан у стилі перил: 2 м від початку бетонних плит
  const FZ = PZ0 + PDEPTH + 2, FX0 = -14, FX1 = L + 14, FZ0 = -2;
  let fp = 0, fb = 0;
  function fenceRun(nm, x0, z0, x1, z1) {
    const horiz = Math.abs(x1 - x0) > Math.abs(z1 - z0);
    const len = horiz ? x1 - x0 : z1 - z0;
    box(nm + '_rail_top', M.frame, horiz ? x0 : x0 - 0.04, GND + 1.55, horiz ? z0 - 0.04 : z0, horiz ? len : 0.08, 0.07, horiz ? 0.08 : len, env);
    box(nm + '_rail_bottom', M.frame, horiz ? x0 : x0 - 0.04, GND + 0.18, horiz ? z0 - 0.04 : z0, horiz ? len : 0.08, 0.07, horiz ? 0.08 : len, env);
    for (let t = 0; t <= len + 0.01; t += 2.5) {
      box('fence_post_' + (++fp), M.frame, (horiz ? x0 + t : x0) - 0.05, GND, (horiz ? z0 : z0 + t) - 0.06, 0.1, 1.75, 0.12, env);
    }
    for (let t = 0.14; t < len; t += 0.14) {
      tube('fence_bar_' + (++fb), M.frame, horiz ? x0 + t : x0, GND + 0.2, horiz ? z0 : z0 + t, 0.013, 1.36, env);
    }
  }
  const FZF = PZ0 + PDEPTH, GATE = 4.0, GX = 30.0;
  fenceRun('fence_front_l', FX0, FZF, GX - GATE / 2, FZF);
  fenceRun('fence_front_r', GX + GATE / 2, FZF, FX1, FZF);
  fenceRun('fence_side_l', FX0, FZ0, FX0, FZF);
  fenceRun('fence_side_r', FX1, FZ0, FX1, FZF);
  // стовпи центрального входу
  box('gate_pier_l', M.frame, GX - GATE / 2 - 0.12, GND, FZF - 0.16, 0.24, 2.05, 0.32, env);
  box('gate_pier_r', M.frame, GX + GATE / 2 - 0.12, GND, FZF - 0.16, 0.24, 2.05, 0.32, env);
}

// обладнання покрівлі: вентшахти й дефлектори
{
  const ductMat = new THREE.MeshStandardMaterial({ name: 'roof_duct', color: 0xb9b3a8, roughness: 0.85 });
  const capMat = new THREE.MeshStandardMaterial({ name: 'roof_duct_cap', color: 0x8f8a80, roughness: 0.8 });
  const ROOF = [
    [5.5, -3.2, 1.1, 0.9], [13.5, -6.5, 0.9, 0.75], [21.5, -3.4, 1.1, 0.9],
    [29.5, -7.0, 0.9, 0.75], [35.5, -3.2, 1.0, 0.8],
    [43.0, -5.5, 1.2, 1.0], [51.0, -9.0, 1.0, 0.85], [59.0, -5.2, 1.2, 1.0],
  ];
  ROOF.forEach(([rx, rz, rw, rh], i) => {
    const n = i + 1, rd = rw * 0.8;
    box('roof_duct_' + n + '_base', capMat, rx - 0.06, TOP + 0.04, rz - 0.06, rw + 0.12, 0.12, rd + 0.12);
    box('roof_duct_' + n, ductMat, rx, TOP + 0.14, rz, rw, rh, rd);
    // ребра жорсткості по шахті
    for (let k = 1; k <= 2; k++) {
      box('roof_duct_' + n + '_rib_' + k, capMat, rx - 0.015, TOP + 0.14 + (rh * k) / 3, rz - 0.015, rw + 0.03, 0.04, rd + 0.03);
    }
    // жалюзі на фронтальній стінці
    for (let k = 0; k < 3; k++) {
      box('roof_duct_' + n + '_louver_' + (k + 1), capMat, rx + 0.1, TOP + 0.26 + k * 0.13, rz + rd, rw - 0.2, 0.06, 0.03);
    }
    box('roof_duct_' + n + '_cap', capMat, rx - 0.1, TOP + 0.14 + rh, rz - 0.1, rw + 0.2, 0.07, rd + 0.2);
    box('roof_duct_' + n + '_cap_top', ductMat, rx - 0.02, TOP + 0.21 + rh, rz - 0.02, rw + 0.04, 0.05, rd + 0.04);
  });
  // люк виходу на покрівлю і тонкі трубки
  box('roof_hatch', ductMat, 30.4, TOP + 0.04, -4.2, 1.2, 0.5, 1.2);
  box('roof_hatch_lid', capMat, 30.3, TOP + 0.54, -4.3, 1.4, 0.08, 1.4);
  box('roof_hatch_hinge', M.metal, 30.35, TOP + 0.5, -4.32, 1.3, 0.06, 0.06);
  box('roof_hatch_handle', M.metal, 30.9, TOP + 0.62, -3.15, 0.2, 0.05, 0.05);
  [[12.0, -2.2], [27.0, -2.4], [46.0, -3.0], [58.0, -3.0]].forEach(([px, pz], i) => {
    const n = i + 1;
    box('roof_pipe_' + n + '_shoe', capMat, px - 0.14, TOP + 0.04, pz - 0.14, 0.28, 0.1, 0.28);
    tube('roof_pipe_' + n, M.metal, px, TOP + 0.14, pz, 0.06, 0.85);
    tube('roof_pipe_' + n + '_collar', capMat, px, TOP + 0.72, pz, 0.085, 0.06);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.12, 16), capMat);
    cap.name = 'roof_pipe_' + n + '_cap';
    cap.position.set(px, TOP + 1.05, pz);
    cap.castShadow = true;
    g.add(cap);
  });

  // круглі дефлектори
  [[9.5, -4.5], [17.5, -8.0], [25.5, -4.6], [39.0, -7.5], [47.0, -11.0], [55.0, -7.5]].forEach(([dx, dz], i) => {
    box('roof_vent_' + (i + 1) + '_base', capMat, dx - 0.3, TOP + 0.04, dz - 0.3, 0.6, 0.1, 0.6);
    tube('roof_vent_' + (i + 1), ductMat, dx, TOP + 0.14, dz, 0.22, 0.7);
    tube('roof_vent_' + (i + 1) + '_ring', capMat, dx, TOP + 0.62, dz, 0.26, 0.06);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.22, 20), capMat);
    cone.name = 'roof_vent_' + (i + 1) + '_cap';
    cone.position.set(dx, TOP + 0.96, dz);
    cone.castShadow = true;
    g.add(cone);
  });
}

// центрування: y-up, база на y=0
const bb = new THREE.Box3().setFromObject(g);
g.position.set(-(bb.min.x + bb.max.x) / 2, -bb.min.y, -(bb.min.z + bb.max.z) / 2);
const wrap = new THREE.Group();
wrap.name = 'lyceum';
wrap.add(g);
stage.setObject(wrap);
env.position.copy(g.position);
stage._scene.add(env);

// Сцена готова — прибираємо заставку завантаження.
document.getElementById('boot').remove();
</script>
