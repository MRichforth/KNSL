<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Інтерактивна 3D-модель фасаду Криворізького природничо-наукового ліцею: обертання, масштаб, експорт в OBJ/GLB.">
<meta name="color-scheme" content="light">
<title>Ліцей — 3D фасад</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%236a6e75'/%3E%3Cpath d='M5 26V13l11-6 11 6v13z' fill='%23f2efe9'/%3E%3Crect x='14' y='18' width='4' height='8' fill='%238b4137'/%3E%3C/svg%3E">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }

<style>
  html, body { margin: 0; height: 100%; background: #efeae4; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { display: block; width: 100vw; height: 100dvh; }

  /* Модель будується у top-level await: без цього екран лишався б порожнім
     і під час завантаження, і після будь-якої помилки. */
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    margin: 0;
    padding: 24px;
    background: #efeae4;
    font: 400 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #4a453e;
    text-align: center;
    white-space: pre-line;
  }
  #boot.failed { color: #8a2f20; }
</style>
</head>
<body>
<three-d-stage name="lyceum-facade" background="#f2ece6"></three-d-stage>
<p id="boot">Завантаження 3D-моделі…</p>
<script>
// Класичний скрипт — виконується до модуля, тому ловить і його помилки теж.
(function () {
  function fail(detail) {
    var el = document.getElementById('boot');
    if (!el || el.classList.contains('failed')) return;
    el.classList.add('failed');
    el.textContent =
      'Не вдалося побудувати 3D-модель.\n\n' +
      (detail || 'Невідома помилка') +
      '\n\nСторінці потрібні WebGL та доступ до unpkg.com.';
  }
  window.addEventListener('error', function (e) {
    fail(String((e && e.message) || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    fail(String((r && r.message) || r || ''));
  });
})();
</script>
<script src="three-d-stage.js"></script>
<script type="module" src="lyceum-scene.js"></script>
</body>
</html>
